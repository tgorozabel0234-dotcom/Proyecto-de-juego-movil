[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Verificaciones deterministas de fisica, sin iniciar una ventana.
tasks.register('physicsCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'PlayerPhysicsCheck'
}
tasks.named('check') { dependsOn 'physicsCheck' }
tasks.register('hookCommandCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'HookCommandCheck'
}
tasks.named('check') { dependsOn 'hookCommandCheck' }

// Las verificaciones se ejecutan como JavaExec (physicsCheck y hookCommandCheck),
// sin un framework JUnit. check depende de ambas y conserva sus fallos de asercion.
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.register('saveStoreCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.some_example_name.SaveStoreCheck'
}
tasks.named('check') { dependsOn 'saveStoreCheck' }

tasks.register('industrialTraversalCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.some_example_name.IndustrialTraversalCheck'
}
tasks.named('check') { dependsOn 'industrialTraversalCheck' }

// Nivel 1 / guion: Salto Frame, Matones, Capataz Brutal, escenas y datos del mapa.
tasks.register('storyCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.some_example_name.StoryLevelCheck'
}
tasks.named('check') { dependsOn 'storyCheck' }

// Recorrido de las 8 salas de campaña (assets/levels/traversal_rules.json).
tasks.register('levelFlowCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.some_example_name.LevelFlowCheck'
}
tasks.named('check') { dependsOn 'levelFlowCheck' }
